<!DOCTYPE html>
<html>
<head>
    <meta name="discription" content="気象データの時別値をデータファイルに追加する。">
    <meta name="auther" content="澤田泰人">
    <meta name="date" content="2025年5月4日">
    <meta charset="UTF-8">
    <title>気象データ 時別値ファイル追加</title>
    <script src=" https://cdnjs.cloudflare.com/ajax/libs/encoding-japanese/2.0.0/encoding.min.js "></script>
    <style>
        @media screen { .large-content { font-size: 24px; width: 100%; } }
        button { background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        h1 { background-color: #4CAF50; color: white; padding: 10px; text-align: center; }
        h2 { padding: 10px; text-align: center; }
        .right-align { text-align: right; }
        #fileList { margin-top: 10px; }
        #errorMessage { color: #b00020; font-weight: bold; white-space: pre-line; }
    </style>
</head>
<body>
    <div class="right-align">
        <button onclick="window.open(' https://www.data.jma.go.jp/gmd/risk/obsdl/index.php ', '_blank')">気象庁のサイトを開く</button>
        <button onclick="window.open('import-weather-data-guide.htm', '_blank')">気象データ取り込み説明</button>
    </div>
    <h1>気象データ 時別値ファイル追加</h1>
    <p>[CSVファイルの二重登録を除去し、時系列でソートします。]</p>
    <div id="drop-area" style="border: 2px dashed #ccc; padding: 20px; text-align: center;">ここに新旧２つのCSVファイルをドラッグ＆ドロップしてください</div>
    <p>または、こちらからファイルを選択:</p>
    <input type="file" id="fileInput" multiple accept=".csv">
    <h2>ドロップしたファイル名一覧:</h2>
    <ul id="fileList"></ul>
    <p id="errorMessage" role="alert"></p>
    <button id="mergeButton">データの追加と表示</button>
    <h2>併合データの編集</h2>
    <pre id="mergedPreview" contenteditable="true" class="large-content" style="border: 1px solid #ccc; padding: 10px; white-space: pre-wrap;"></pre>
    <button id="downloadButton">併合ファイルのダウンロード</button>
<script>
let headers = [], allDataLines = [], selectedRegion = null, mergeRejected = false;
function csvColumns(line) { return line.split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/); }
function cleanCell(value) { return (value || '').trim().replace(/^"|"$/g, ''); }
function shiftJISToUTF8(buffer) { return new TextDecoder('shift-jis').decode(new Uint8Array(buffer)); }
function getRegion(lines) { const columns = csvColumns(lines[1] || ''); return cleanCell(columns[4] || columns[3]); }
function showError(message) { const e = document.getElementById('errorMessage'); if (e) e.textContent = message; alert(message); }
function rejectMerge(message) { headers = []; allDataLines = []; selectedRegion = null; mergeRejected = true; document.getElementById('mergedPreview').textContent = ''; showError(message); }
function reorderCSVContent(lines) {
    const cleaned = lines.filter(line => line.trim() !== '' || line.includes('\r'));
    const header = cleaned.slice(0, 4), data = cleaned.slice(4);
    if (header.length < 4) return header;
    const h1 = csvColumns(header[2]), h2 = csvColumns(header[3]);
    const combined = h1.map((value, i) => cleanCell(value) + cleanCell(h2[i]));
    const targets = ['年','月','日','時','気温(℃)','気温(℃)品質情報','気温(℃)均質番号','降水量(mm)','降水量(mm)品質情報','降水量(mm)均質番号','日照時間(時間)','日照時間(時間)品質情報','日照時間(時間)均質番号','風向・風速(m/s)','風向・風速(m/s)品質情報','風向・風速(m/s)均質番号','最大風速(m/s)','最大風速(m/s)品質情報','最大風速(m/s)均質番号','最高気温(℃)','最高気温(℃)品質情報','最高気温(℃)均質番号','最低気温(℃)','最低気温(℃)品質情報','最低気温(℃)均質番号'];
    const indices = targets.map(target => combined.findIndex(value => value.includes(target)));
    return [...header, ...data.map(line => { const columns = csvColumns(line); return indices.map(i => i >= 0 ? (columns[i] || '0') : '0').join(','); })];
}
async function handleFileSelect(files) {
    if (!files.length) return;
    const pending = [];
    for (const file of files) {
        const text = shiftJISToUTF8(await file.arrayBuffer());
        const reordered = reorderCSVContent(text.replace(/\r\n|\r/g, '\n').split('\n'));
        if (reordered.length < 4) { rejectMerge(`CSVファイル「${file.name}」のヘッダーを読み取れません。`); return; }
        pending.push({ file, reordered, region: getRegion(reordered) });
    }
    const regions = [...new Set(pending.map(item => item.region))];
    if (selectedRegion !== null) regions.push(selectedRegion);
    const uniqueRegions = [...new Set(regions)];
    if (uniqueRegions.length !== 1 || !uniqueRegions[0]) { rejectMerge(`地域が異なるCSVファイルはマージできません。\n検出した地域: ${uniqueRegions.filter(Boolean).join('、') || '不明'}`); return; }
    const headerParts = pending.map(item => item.reordered.slice(1, 3).join('\n').trim());
    if (headerParts.some(header => header !== headerParts[0])) { rejectMerge('ヘッダーが一致していません。異なる形式のCSVファイルのため、マージを中止しました。'); return; }
    selectedRegion = uniqueRegions[0]; mergeRejected = false; document.getElementById('errorMessage').textContent = '';
    for (const item of pending) { if (headers.length === 0 && !item.file.name.includes('data')) headers = item.reordered.slice(0, 4); allDataLines.push(...item.reordered.slice(4)); }
}
function mergeAndPreviewCSV() {
    if (mergeRejected || !selectedRegion || !allDataLines.length) { showError('地域が一致するCSVファイルを選択してからマージしてください。'); return; }
    const unique = new Map();
    allDataLines.forEach(line => { const values = csvColumns(line).slice(0, 4).map(cleanCell); const key = values.map((v, i) => i === 0 ? v.padStart(4, '0') : v.padStart(2, '0')).join('-'); if (!unique.has(key)) unique.set(key, line); });
    const sorted = Array.from(unique.entries()).sort((a, b) => a[0].localeCompare(b[0]));
    document.getElementById('mergedPreview').textContent = [...headers, ...sorted.map(item => item[1])].join('\n');
    if (sorted.length) document.getElementById('downloadButton').setAttribute('data-filename', createSaveFileName(headers, sorted.map(item => item[1])));
    document.getElementById('mergedPreview').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function createSaveFileName(headerLines, dataLines) {
    const headerColumns = csvColumns(headerLines[1] || '');
    const firstChar = cleanCell(headerColumns[4] || headerColumns[3] || 'デフォルト');
    const dates = dataLines.map(line => {
        const values = csvColumns(line).slice(0, 3).map(cleanCell);
        const year = Number(values[0]), month = Number(values[1]), day = Number(values[2]);
        if (!Number.isInteger(year) || !Number.isInteger(month) || !Number.isInteger(day) || month < 1 || month > 12 || day < 1 || day > 31) return null;
        const date = new Date(Date.UTC(year, month - 1, day));
        return date.getUTCFullYear() === year && date.getUTCMonth() === month - 1 && date.getUTCDate() === day ? date : null;
    }).filter(Boolean);
    if (!dates.length) return `${firstChar}時別値.csv`;
    const latest = dates.reduce((a, b) => a > b ? a : b);
    const date = `${latest.getUTCFullYear()}-${String(latest.getUTCMonth() + 1).padStart(2, '0')}-${String(latest.getUTCDate()).padStart(2, '0')}`;
    return `${firstChar}時別値${date}.csv`;
}
function downloadEditedCSV() {
    const preview = document.getElementById('mergedPreview');
    if (!preview || mergeRejected || !preview.textContent.trim()) { showError('マージ済みデータがないため、ダウンロードできません。'); return; }
    const codes = Encoding.stringToCode(preview.textContent);
    const sjis = Encoding.convert(codes, { from: 'UNICODE', to: 'SJIS', type: 'array' });
    const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([new Uint8Array(sjis)], { type: 'text/csv;charset=shift-jis;' }));
    link.download = document.getElementById('downloadButton').getAttribute('data-filename') || 'merged_data.csv'; document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(link.href);
}
function displayFileNames(files) { const list = document.getElementById('fileList'); for (const file of files) { const item = document.createElement('li'); item.textContent = file.name; list.appendChild(item); } }
document.addEventListener('DOMContentLoaded', () => {
    const drop = document.getElementById('drop-area');
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.style.backgroundColor = '#f0f0f0'; });
    drop.addEventListener('dragleave', () => { drop.style.backgroundColor = ''; });
    drop.addEventListener('drop', e => { e.preventDefault(); drop.style.backgroundColor = ''; handleFileSelect(e.dataTransfer.files); displayFileNames(e.dataTransfer.files); });
    document.getElementById('fileInput').addEventListener('change', e => { handleFileSelect(e.target.files); displayFileNames(e.target.files); });
    document.getElementById('mergeButton').addEventListener('click', mergeAndPreviewCSV);
    document.getElementById('downloadButton').addEventListener('click', downloadEditedCSV);
});
</script>
</body>
</html>
