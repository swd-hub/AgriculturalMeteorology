<!DOCTYPE html>
<html>
<head>
    <meta name="discription" content="気象データの時別値をデータファイルに追加する。">
    <meta name="auther" content="澤田泰人">
    <meta name="date" content="2025年5月4日">
    <meta charset="UTF-8">
    <title>気象データ 時別値ファイル追加</title>
    <script src=" https://cdnjs.cloudflare.com/ajax/libs/encoding-japanese/2.0.0/encoding.min.js "></script>
    <style>
        @media screen { .large-content { font-size: 24px; width: 100%; } }
        button { background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        h1 { background-color: #4CAF50; color: white; padding: 10px; text-align: center; }
        h2 { padding: 10px; text-align: center; }
        .right-align { text-align: right; }
        #fileList { margin-top: 10px; }
        #errorMessage { color: #b00020; font-weight: bold; white-space: pre-line; }
    </style>
</head>
<body>
    <div class="right-align">
        <button onclick="window.open(' https://www.data.jma.go.jp/gmd/risk/obsdl/index.php ', '_blank')">気象庁のサイトを開く</button>
        <button onclick="window.open('import-weather-data-guide.htm', '_blank')">気象データ取り込み説明</button>
    </div>
    <h1>気象データ 時別値ファイル追加</h1>
    <p>[CSVファイルの二重登録を除去し、時系列でソートします。]</p>
    <div id="drop-area" style="border: 2px dashed #ccc; padding: 20px; text-align: center;">ここに新旧２つのCSVファイルをドラッグ＆ドロップしてください</div>
    <p>または、こちらからファイルを選択:</p>
    <input type="file" id="fileInput" multiple accept=".csv">
    <h2>ドロップしたファイル名一覧:</h2>
    <ul id="fileList"></ul>
    <p id="errorMessage" role="alert"></p>
    <button id="mergeButton">データの追加と表示</button>
    <h2>併合データの編集</h2>
    <pre id="mergedPreview" contenteditable="true" class="large-content" style="border: 1px solid #ccc; padding: 10px; white-space: pre-wrap;"></pre>
    <button id="downloadButton">併合ファイルのダウンロード</button>
<script>
let headers = [];
let allDataLines = [];
let selectedRegion = null;
let mergeRejected = false;

function shiftJISToUTF8(arrayBuffer) {
    return new TextDecoder("shift-jis").decode(new Uint8Array(arrayBuffer));
}

function csvColumns(line) {
    return line.split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/);
}

function cleanCell(value) {
    return (value || '').trim().replace(/^"|"$/g, '');
}

// 気象庁CSVでは、2行目の4列目に観測地点（地域）名が入ります。
function getRegion(headerLines) {
    return cleanCell(csvColumns(headerLines[1])[4] || csvColumns(headerLines[1])[3]);
}

function showError(message) {
    const errorElement = document.getElementById('errorMessage');
    if (errorElement) errorElement.textContent = message;
    alert(message);
}

function rejectMerge(message) {
    headers = [];
    allDataLines = [];
    selectedRegion = null;
    mergeRejected = true;
    const preview = document.getElementById('mergedPreview');
    if (preview) preview.textContent = '';
    showError(message);
}

function reorderCSVContent(lines) {
    const cleanedLines = lines.filter(line => line.trim() !== "" || line.includes("\r"));
    const headerLines = cleanedLines.slice(0, 4);
    const dataLines = cleanedLines.slice(4);
    if (headerLines.length < 4) return headerLines;

    const lines1 = csvColumns(headerLines[2]);
    const lines2 = csvColumns(headerLines[3]);
    const combinedHead = lines1.map((value, index) => cleanCell(value) + cleanCell(lines2[index]));
    const targetHeaders = [
        "年", "月", "日", "時", "気温(℃)", "気温(℃)品質情報", "気温(℃)均質番号",
        "降水量(mm)", "降水量(mm)品質情報", "降水量(mm)均質番号", "日照時間(時間)",
        "日照時間(時間)品質情報", "日照時間(時間)均質番号", "風向・風速(m/s)",
        "風向・風速(m/s)品質情報", "風向・風速(m/s)均質番号", "最大風速(m/s)",
        "最大風速(m/s)品質情報", "最大風速(m/s)均質番号", "最高気温(℃)",
        "最高気温(℃)品質情報", "最高気温(℃)均質番号", "最低気温(℃)",
        "最低気温(℃)品質情報", "最低気温(℃)均質番号"
    ];
    const indices = targetHeaders.map(header => combinedHead.findIndex(value => value.includes(header)));
    const reorderedLines = dataLines.map(line => {
        const columns = csvColumns(line);
        return indices.map(index => index >= 0 ? (columns[index] || '0') : '0').join(',');
    });
    return [...headerLines, ...reorderedLines];
}

async function handleFileSelect(files) {
    if (!files.length) return;

    const pendingFiles = [];
    for (const file of files) {
        const text = shiftJISToUTF8(await file.arrayBuffer());
        const reordered = reorderCSVContent(text.replace(/\r\n|\r/g, "\n").split("\n"));
        if (reordered.length < 4) {
            rejectMerge(`CSVファイル「${file.name}」のヘッダーを読み取れません。`);
            return;
        }
        pendingFiles.push({ file, reordered, region: getRegion(reordered) });
    }

    const regions = [...new Set(pendingFiles.map(item => item.region))];
    if (selectedRegion !== null) regions.push(selectedRegion);
    const uniqueRegions = [...new Set(regions)];
    if (uniqueRegions.length !== 1 || !uniqueRegions[0]) {
        rejectMerge(`地域が異なるCSVファイルはマージできません。\n検出した地域: ${uniqueRegions.filter(Boolean).join('、') || '不明'}`);
        return;
    }

    const headerParts = pendingFiles.map(item => item.reordered.slice(1, 3).join("\n").trim());
    if (headerParts.some(header => header !== headerParts[0])) {
        rejectMerge('ヘッダーが一致していません。異なる形式のCSVファイルのため、マージを中止しました。');
        return;
    }

    selectedRegion = uniqueRegions[0];
    mergeRejected = false;
    document.getElementById('errorMessage').textContent = '';
    for (const item of pendingFiles) {
        if (headers.length === 0 && !item.file.name.includes('data')) headers = item.reordered.slice(0, 4);
        allDataLines.push(...item.reordered.slice(4));
    }
}

function mergeAndPreviewCSV() {
    if (mergeRejected || !selectedRegion || !allDataLines.length) {
        showError('地域が一致するCSVファイルを選択してからマージしてください。');
        return;
    }
    const uniqueDataMap = new Map();
    allDataLines.forEach(line => {
        const [year = '', month = '', day = '', hour = ''] = csvColumns(line);
        const key = `${year.padStart(4, '0')}-${month.padStart(2, '0')}-${day.padStart(2, '0')}-${hour.padStart(2, '0')}`;
        if (!uniqueDataMap.has(key)) uniqueDataMap.set(key, line);
    });
    const sortedData = Array.from(uniqueDataMap.entries()).sort((a, b) => a[0].localeCompare(b[0]));
    document.getElementById('mergedPreview').textContent = [...headers, ...sortedData.map(item => item[1])].join('\n');
    if (sortedData.length) document.getElementById('downloadButton').setAttribute('data-filename', createSaveFileName(headers, sortedData.map(item => item[1])));
    scrollToPreview();
}

function createSaveFileName(headerLines, dataLines) {
    const firstChar = (csvColumns(headerLines[1] || '')[4] || 'デフォルト');
    const latest = dataLines.map(line => {
        const [year, month, day] = csvColumns(line).slice(0, 3).map(Number);
        return new Date(year, month - 1, day);
    }).sort((a, b) => b - a)[0];
    if (!latest || isNaN(latest)) return `${firstChar}時別値.csv`;
    return `${firstChar}時別値${latest.getFullYear()}-${String(latest.getMonth() + 1).padStart(2, '0')}-${String(latest.getDate()).padStart(2, '0')}.csv`;
}

function downloadEditedCSV() {
    const preview = document.getElementById('mergedPreview');
    if (!preview || mergeRejected || !preview.textContent.trim()) {
        showError('マージ済みデータがないため、ダウンロードできません。');
        return;
    }
    const unicodeArray = Encoding.stringToCode(preview.textContent);
    const sjisArray = Encoding.convert(unicodeArray, { from: 'UNICODE', to: 'SJIS', type: 'array' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([new Uint8Array(sjisArray)], { type: 'text/csv;charset=shift-jis;' }));
    link.download = document.getElementById('downloadButton').getAttribute('data-filename') || 'merged_data.csv';
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
}

function displayFileNames(files) {
    const list = document.getElementById('fileList');
    for (const file of files) { const item = document.createElement('li'); item.textContent = file.name; list.appendChild(item); }
}
function scrollToPreview() { document.getElementById('mergedPreview').scrollIntoView({ behavior: 'smooth', block: 'center' }); }

document.addEventListener('DOMContentLoaded', () => {
    const dropArea = document.getElementById('drop-area');
    dropArea.addEventListener('dragover', event => { event.preventDefault(); dropArea.style.backgroundColor = '#f0f0f0'; });
    dropArea.addEventListener('dragleave', () => { dropArea.style.backgroundColor = ''; });
    dropArea.addEventListener('drop', event => { event.preventDefault(); dropArea.style.backgroundColor = ''; handleFileSelect(event.dataTransfer.files); displayFileNames(event.dataTransfer.files); });
    document.getElementById('fileInput').addEventListener('change', event => { handleFileSelect(event.target.files); displayFileNames(event.target.files); });
    document.getElementById('mergeButton').addEventListener('click', mergeAndPreviewCSV);
    document.getElementById('downloadButton').addEventListener('click', downloadEditedCSV);
});
</script>
</body>
</html>
