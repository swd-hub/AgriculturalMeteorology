        document.addEventListener('DOMContentLoaded', function() {
            function restoreFromCache(content, fileName) {
                const parsedData = parseCSV(content);
                initializeTable(parsedData);
                handleFileSelect(content, fileName);
            }

            CsvIndexedDBCache.setupUI({
                dbName: 'annual_variation_weather_effective_db',
                fileInputId: 'fileInput',

                statusId: 'cacheStatus',
                onRestored: restoreFromCache,

                    if (tbody) tbody.innerHTML = "";
                    const tableContainer = document.getElementById("table-container");
                    if (tableContainer) tableContainer.innerHTML = "";
                }
            });

            // setupUI内部のDOMContentLoadedリスナーは登録タイミングの都合で発火しないため、明示的に復元する
            CsvIndexedDBCache.load('annual_variation_weather_effective_db').then(function(saved) {
                if (saved && saved.mode === 'single') {
                    CsvIndexedDBCache.memory.content = saved.content;
                    CsvIndexedDBCache.memory.fileName = saved.fileName || '保存済みCSV';
                    CsvIndexedDBCache.updateStatus(document.getElementById('cacheStatus'));
                    restoreFromCache(saved.content, saved.fileName);
                }
            }).catch(function(err) { console.warn('IndexedDB復元失敗:', err); });

            document.getElementById('updateButton').addEventListener('click', () => handleFileSelect(), false);
        });

async function readCSVFile(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
    });
}

function shiftJISToUTF8(arrayBuffer) {
    const decoder = new TextDecoder('shift-jis');
    const uint8Array = new Uint8Array(arrayBuffer);
    return decoder.decode(uint8Array);
}

function handleFileSelect(content, fileName) {
    let utf8Content = null;
    if (typeof content === 'string') {
        utf8Content = content;
    } else {
        if (typeof CsvIndexedDBCache !== 'undefined' && CsvIndexedDBCache.memory.content) {
            utf8Content = CsvIndexedDBCache.memory.content;
        }
    }

    const processData = (text) => {
        const data = parseCSV(text);
        data.forEach(d => d.date.setDate(d.date.getDate()));
        const startDate = new Date(document.getElementById("cultivationStartDate").value);
        const endDate = new Date(document.getElementById("cultivationEndDate").value);
        const tempMin = parseFloat(document.getElementById("tempMin").value);
        const tempMax = parseFloat(document.getElementById("tempMax").value);
        const graphStart = new Date(startDate);
        graphStart.setMonth(graphStart.getMonth());
        const graphEnd = new Date(endDate);
        graphEnd.setMonth(graphEnd.getMonth());
        const filteredData = filterData(data, graphStart, graphEnd);
        const cumulativeData = calculateCumulativeDataWithTable(filteredData, startDate, endDate, tempMin, tempMax);
        updateTable(cumulativeData.table);
    };

    if (utf8Content !== null) {
        processData(utf8Content);
    } else {
        const file = document.getElementById("fileInput").files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
            const text = shiftJISToUTF8(e.target.result);
            processData(text);
        };
        reader.readAsArrayBuffer(file);
    }
}



       
    function filterData(data, graphStart, graphEnd) {
        return data.filter(d => d.date >= graphStart && d.date <= graphEnd);
    }


//パース
function parseCSV(content) {
   const lines = content.trim().split('\n').filter(line => line.trim() !== "");

    // "数行のヘッダーを結合してcombinedHeadを作成
    let lines1 = lines[2].split(',');
    let lines2 = lines[3].split(',');
    let lines3 = lines[4].split(',');

        let combinedHead = [];
        for (let i = 0; i < lines1.length; i++) {
            combinedHead.push(lines1[i].replace(/\r/g, '') + lines2[i].replace(/\r/g, '') + lines3[i].replace(/\r/g, ''));
        }

    // デバッグログ
    console.log('Combined Header:', combinedHead);

    const targetHeaders = ["年", "月", "日", "平均気温(℃)", "降水量の合計(mm)", "日照時間(時間)"];
   
    let indicesToSelect = targetHeaders.map(header => combinedHead.indexOf(header));

    // デバッグログ
    //console.log('Indices to Select:', indicesToSelect);

    // データ行を処理
    const dataLines = lines.slice(6).map(line => {   //5だった
    const cols = line.split(',');
    const selectedCols = indicesToSelect.map(index => index >= 0 ? cols[index] || '0' : '0'); // 存在しない場合はデフォルト値'0'

       // console.log('Selected Columns:', selectedCols);
        return selectedCols.join(',');
    });

    console.log('Data Lines:', dataLines);

    // ヘッダー行を追加
    dataLines.unshift(targetHeaders.join(','));

    // デバッグログ
    console.log('Data Lines with Header:', dataLines);

    return dataLines.slice(1).map(line => { // ヘッダー行をスキップ
        const cols = line.split(",");
        return {
            date: new Date(Date.UTC(cols[0], cols[1] - 1, cols[2])),
            temperature: parseFloat(cols[3]) || 0,
            precipitation: parseFloat(cols[4]) || 0,
            sunshine: parseFloat(cols[5]) || 0
        };
    });
}




//入力期間の集計結果を表示

            } catch (error) {
                console.error("テーブル更新中にエラーが発生しました:", error);
            }
        }

function calculateEffectiveAccumulatedTemperature(data, startDate, endDate, tempMin, tempMax) {
    let effectiveTempSum = 0;
    let validDataCount = 0;
    let effectiveSunSum = 0;
    let precSum = 0;
    // トグルボタンのチェック状態を取得
    const tempSumToggle = document.getElementById('tempSumToggle').checked;
    data.forEach(entry => {
        const date = new Date(entry.date);
        // startDate を 1か月前に設定
        let adjustedStartDate = new Date(startDate);
        adjustedStartDate.setMonth(adjustedStartDate.getMonth() - 1);
        // 栽培期間内の条件を適用
        if (date >= adjustedStartDate && date <= endDate) {
            let temperature = entry.temperature;
            // トグルボタンがチェックされている場合、温度の上限を適用
            if (tempSumToggle && temperature > tempMax) {
                temperature = tempMax;
            }
            // 気温条件を満たした場合のみ加算
            if (temperature >= tempMin && temperature <= tempMax && date >= startDate && date <= endDate) {
                effectiveTempSum += (temperature - tempMin); // 下限値を引いた値を積算
                effectiveSunSum += entry.sunshine;
                validDataCount++;
            }
            // 降水量は温度に関係なく加算
            precSum += entry.precipitation;
        }
    });
    return { effectiveTempSum, effectiveSunSum, validDataCount, precSum };
}

//
function calculateCumulativeDataWithTable(data, startDate, endDate, tempMin, tempMax) {
    let tempSum = 0, precSum = 0, sunSum = 0;
    let cumulative = { dates: [], temperature: [], precipitation: [], sunshine: [], table: [] };
    // トグルボタンのチェック状態を取得
    const tempSumToggle = document.getElementById('tempSumToggle').checked;
    data.forEach(entry => {
        const date = new Date(entry.date);
        // 栽培期間内の条件を適用
        if (date >= startDate && date <= endDate) {
            let temperature = entry.temperature;
            // トグルボタンがチェックされている場合、温度の上限を適用
            if (tempSumToggle && temperature > tempMax) {
                temperature = tempMax;
            }
            // 気温が下限と上限を満たした場合のみ累積計算
            if (temperature >= tempMin && temperature <= tempMax) {
                tempSum += (temperature - tempMin);
                sunSum += entry.sunshine;
            }
            // 降水量は温度に関係なく累積
            precSum += entry.precipitation;
        }
        // 累積データの記録
        cumulative.dates.push(entry.date.toISOString().split('T')[0]);
        cumulative.temperature.push(tempSum);
        cumulative.precipitation.push(precSum);
        cumulative.sunshine.push(sunSum);
    });
    // 栽培期間の日数を計算
    const cultivationDays = Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24) + 1); // 終了日を含む
    const { effectiveTempSum, effectiveSunSum, validDataCount, precSum: calculatedPrecSum } = calculateEffectiveAccumulatedTemperature(data, startDate, endDate, tempMin, tempMax);
    cumulative.table = [
        { label: "栽培期間の日数 (Cultivation Period in Days)", value: cultivationDays },
        { label: "有効データ数 (Valid Data Count)", value: validDataCount },
        { label: "有効積算温度(℃)（Effective Cumulative Temperature）:", value: Math.floor(effectiveTempSum) },
        { label: "累積降水量(mm)（Cumulative Rainfall）:", value: Math.floor(calculatedPrecSum) },
        { label: "有効日照時間の積算(時間)（Accumulated sunshine hours）:", value: Math.floor(effectiveSunSum) }
    ];
    return cumulative;
}

            initializeTable(parsedData);

            console.error("ファイルを読み込む際にエラーが発生しました:", error);
            alert("ファイルの読み込みに失敗しました。");
        });
});

// 年ごとの積算データを計算する関数
function calculateCumulativeValues(data, startDate, endDate, tempMin, tempMax) {
    const results = {};
    let currentYear = startDate.getFullYear();
    let followingYear = endDate.getFullYear(); //////////////修正中//////////////////
   
    const tempSumToggle = document.getElementById('tempSumToggle').checked;
    while (currentYear > 1978) {
        const periodStart = new Date(Date.UTC(currentYear, startDate.getMonth(), startDate.getDate()));
        const periodEnd = new Date(Date.UTC(followingYear, endDate.getMonth(), endDate.getDate()));
       
        // 気温条件をフィルタリングに含めない
        const filteredData = data.filter(entry => {
            const entryDate = new Date(entry.date);
            return entryDate >= periodStart && entryDate <= periodEnd;
        });
        let tempSum = 0;
        let sunSum = 0;
        let precSum = 0;
        filteredData.forEach(entry => {
            let temperature = entry.temperature;
            // 温度計算の条件付き調整
            if (tempSumToggle && temperature > tempMax) {
                temperature = tempMax;
            }
            // 気温条件に基づいて累積する値
            if (temperature >= tempMin && temperature <= tempMax) {
                tempSum += (temperature - tempMin);
                sunSum += entry.sunshine;
            }
            // 降水量は気温条件を無視して累積
            precSum += entry.precipitation;
        });
        // デバッグログ
        //console.log('Year:', currentYear, 'Filtered Data Length:', filteredData.length, 'precSum:', precSum);
        if (filteredData.length > 0) {
            results[currentYear] = {
                period: `${periodStart.toISOString().split('T')[0]} ～ ${periodEnd.toISOString().split('T')[0]}`,
                cumulativeTemperature: tempSum.toFixed(1),
                cumulativePrecipitation: precSum.toFixed(1),
                cumulativeSunshine: sunSum.toFixed(1),
            };
        }
        currentYear--;
        followingYear--;
       
    }
    return results;
}
// 年ごとのテーブルを生成する関数
function createCumulativeTable(cumulativeResults) {
    const table = document.getElementById("startYearTable");
    table.innerHTML = "";
    const headerRow = document.createElement("tr");
    const headers = ["栽培期間", "有効積算温度(℃)", "累積降水量(mm)", "有効日照時間(時間)"];
    headers.forEach(header => {
        const th = document.createElement("th");
        th.textContent = header;
        headerRow.appendChild(th);
    });
    table.appendChild(headerRow);
    Object.keys(cumulativeResults).forEach(year => {
        const result = cumulativeResults[year];
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${result.period}</td>
            <td>${result.cumulativeTemperature}</td>
            <td>${result.cumulativePrecipitation}</td>
            <td>${result.cumulativeSunshine}</td>
        `;
        table.appendChild(tr);
    });
}


// 初期化関数：入力条件を取得してテーブルを更新
function initializeTable(data) {
    const startDate = new Date(document.getElementById("cultivationStartDate").value);
    const endDate = new Date(document.getElementById("cultivationEndDate").value);
    if (startDate >= endDate) {
        alert("終了日は開始日より後の日付を選択してください。");
        return;
    }
    const tempMin = parseFloat(document.getElementById("tempMin").value);
    const tempMax = parseFloat(document.getElementById("tempMax").value);
    const cumulativeResults = calculateCumulativeValues(data, startDate, endDate, tempMin, tempMax);
   
//console.log('cumulativeResults',cumulativeResults);

    createCumulativeTable(cumulativeResults);
    createIndividualCharts(cumulativeResults);
}

<script>
(function (global) {
  const STORE_NAME = 'csvStore';
  const KEY_SINGLE = 'lastCsv';
  const KEY_MULTIPLE = 'lastCsvMultiple';

  const memory = { content: null, fileName: null, files: null };

  function injectStyles() {
    if (document.getElementById('csv-idb-cache-style')) return;
    const style = document.createElement('style');
    style.id = 'csv-idb-cache-style';
    style.textContent = `
#clearCacheBtn {
  background-color: #e53935;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  margin-left: 0.5em;
}
#clearCacheBtn:hover { background-color: #c62828; }
#cacheStatus {
  display: inline-block;
  margin-left: 0.8em;
  font-size: 0.95em;
  color: #555;
}`;
    document.head.appendChild(style);
  }

  function openDB(dbName) {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(dbName, 1);
      req.onerror = () => reject(req.error);
      req.onsuccess = () => resolve(req.result);
      req.onupgradeneeded = (event) => {
        const db = event.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME);
        }
      };
    });
  }

  function put(db, key, value) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function get(db, key) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }

  function remove(db, key) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function save(dbName, fileName, content) {
    memory.content = content;
    memory.fileName = fileName;
    memory.files = null;
    const db = await openDB(dbName);
    await put(db, KEY_SINGLE, { fileName, content, savedAt: Date.now() });
    await remove(db, KEY_MULTIPLE);
  }

  async function saveMultiple(dbName, files) {
    memory.files = files.slice();
    memory.content = null;
    memory.fileName = null;
    const db = await openDB(dbName);
    await put(db, KEY_MULTIPLE, { files, savedAt: Date.now() });
    await remove(db, KEY_SINGLE);
  }

  async function load(dbName) {
    const db = await openDB(dbName);
    const multiple = await get(db, KEY_MULTIPLE);
    if (multiple && multiple.files && multiple.files.length) {
      return { mode: 'multiple', files: multiple.files };
    }
    const single = await get(db, KEY_SINGLE);
    if (single && single.content) {
      return { mode: 'single', fileName: single.fileName, content: single.content };
    }
    return null;
  }

  async function clear(dbName) {
    memory.content = null;
    memory.fileName = null;
    memory.files = null;
    const db = await openDB(dbName);
    await remove(db, KEY_SINGLE);
    await remove(db, KEY_MULTIPLE);
  }

  function shiftJISToUTF8(arrayBuffer) {
    const decoder = new TextDecoder('shift-jis');
    const uint8Array = new Uint8Array(arrayBuffer);
    return decoder.decode(uint8Array);
  }

  function updateStatus(statusEl) {
    if (!statusEl) return;
    if (memory.files && memory.files.length) {
      statusEl.textContent = `メモリ保持中: ${memory.files.length}件のCSV`;
    } else if (memory.content && memory.fileName) {
      statusEl.textContent = `メモリ保持中: ${memory.fileName}`;
    } else {
      statusEl.textContent = '';
    }
  }

  function setupUI(options) {
    const {
      dbName,
      fileInputId = 'fileInput',
      clearBtnId = 'clearCacheBtn',
      statusId = 'cacheStatus',
      onRestored,
      onCleared,
      isMultiple = false
    } = options;

    injectStyles();

    const clearBtn = document.getElementById(clearBtnId);
    const statusEl = document.getElementById(statusId);
    const fileInput = document.getElementById(fileInputId);

    // IndexedDBからの自動復元
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const saved = await load(dbName);
        if (!saved) return;
        if (saved.mode === 'multiple') {
          memory.files = saved.files.slice();
          memory.content = null;
          memory.fileName = null;
          updateStatus(statusEl);
          if (typeof onRestored === 'function') {
            onRestored(saved.files);
          }
        } else {
          memory.content = saved.content;
          memory.fileName = saved.fileName || '保存済みCSV';
          memory.files = null;
          updateStatus(statusEl);
          if (typeof onRestored === 'function') {
            onRestored(saved.content, saved.fileName);
          }
        }
      } catch (err) {
        console.warn('IndexedDB復元失敗:', err);
      }
    });

    // ファイル選択時の自動保存処理
    if (fileInput) {
      fileInput.addEventListener('change', async (event) => {
        const files = event.target.files;
        if (!files || files.length === 0) return;

        try {
          if (isMultiple) {
            const loadedFiles = [];
            for (const file of files) {
              const arrayBuffer = await file.arrayBuffer();
              const text = shiftJISToUTF8(arrayBuffer);
              loadedFiles.push({ name: file.name, content: text });
            }
            await saveMultiple(dbName, loadedFiles);
            updateStatus(statusEl);
            if (typeof onRestored === 'function') {
              onRestored(loadedFiles);
            }
          } else {
            const file = files[0];
            const arrayBuffer = await file.arrayBuffer();
            const text = shiftJISToUTF8(arrayBuffer);
            await save(dbName, file.name, text);
            updateStatus(statusEl);
            if (typeof onRestored === 'function') {
              onRestored(text, file.name);
            }
          }
        } catch (err) {
          console.error('ファイルの自動IndexedDB保存に失敗しました:', err);
        }
      });
    }

    if (clearBtn) {
      clearBtn.addEventListener('click', async () => {
        const saved = memory.content || memory.files || (await load(dbName));
        if (!saved) {
          alert('削除するIndexedDBデータはありません。');
          return;
        }
        if (!confirm('IndexedDBに保存したCSVデータとメモリ上のデータを削除しますか？')) {
          return;
        }
        try {
          await clear(dbName);
        } catch (err) {
          console.warn('IndexedDB削除失敗:', err);
          alert('IndexedDBデータの削除に失敗しました。');
          return;
        }
        if (fileInput) fileInput.value = '';
        updateStatus(statusEl);
        if (typeof onCleared === 'function') onCleared();
        alert('IndexedDBデータとメモリ上のデータを削除しました。');
      });
    }
  }

  global.CsvIndexedDBCache = {
    memory,
    save,
    saveMultiple,
    load,
    clear,
    updateStatus,
    setupUI,
    shiftJISToUTF8
  };
})(window);

</script>

<div id="chartZoomModal" class="chart-zoom-modal">
  <div class="chart-zoom-content">
    <button type="button" id="chartZoomClose" class="chart-zoom-close" aria-label="閉じる">&times;</button>
    <canvas id="chartZoomCanvas"></canvas>
  </div>
</div>
<script>
(function() {
  var zoomChart = null;
  var modal = document.getElementById('chartZoomModal');
  var zoomCanvas = document.getElementById('chartZoomCanvas');
  var closeBtn = document.getElementById('chartZoomClose');

  function openZoom(sourceCanvas) {
    if (typeof Chart === 'undefined' || typeof Chart.getChart !== 'function') return;
    var chart = Chart.getChart(sourceCanvas);
    if (!chart) return; // データ未読込などでグラフが存在しない場合は何もしない

    if (zoomChart) { zoomChart.destroy(); zoomChart = null; }

    var config;
    try {
      config = {
        type: chart.config.type,
        data: JSON.parse(JSON.stringify(chart.config.data)),
        options: JSON.parse(JSON.stringify(chart.config.options || {}))
      };
    } catch (e) {
      console.warn('グラフ拡大用の設定コピーに失敗しました:', e);
      return;
    }
    config.options.responsive = true;
    config.options.maintainAspectRatio = false;

    zoomChart = new Chart(zoomCanvas.getContext('2d'), config);
    modal.classList.add('active');
  }

  function closeZoom() {
    modal.classList.remove('active');
    if (zoomChart) { zoomChart.destroy(); zoomChart = null; }
  }

  document.addEventListener('click', function(e) {
    var canvas = e.target.closest && e.target.closest('canvas');
    if (!canvas || canvas.id === 'chartZoomCanvas') return;
    openZoom(canvas);
  });

  closeBtn.addEventListener('click', closeZoom);
  modal.addEventListener('click', function(e) {
    if (e.target === modal) closeZoom();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeZoom();
  });
})();
</script>
